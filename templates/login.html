<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login</title>
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #111827;
      --panel: rgba(15, 23, 42, 0.9);
      --panel-2: #1f2937;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent: #38bdf8;
      --border: rgba(148, 163, 184, 0.2);
      --danger: #ef4444;
      --shadow: rgba(15, 23, 42, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, var(--bg-1), var(--bg-2), #1e293b);
      color: var(--text);
    }

    .panel {
      width: min(440px, 100%);
      background: var(--panel);
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 24px 60px var(--shadow);
      padding: 28px;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: clamp(2rem, 4vw, 2.4rem);
      text-align: center;
    }

    .subtitle {
      margin: 0 0 22px;
      color: var(--muted);
      text-align: center;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    label {
      font-weight: 600;
      color: var(--muted);
    }

    input {
      width: 100%;
      padding: 12px 14px;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    button {
      appearance: none;
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      background: linear-gradient(135deg, var(--accent), #0ea5e9);
      color: white;
      font-weight: 700;
      cursor: pointer;
      font-size: 1rem;
    }

    .error {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fecaca;
      padding: 10px 12px;
      border-radius: 10px;
      text-align: center;
    }

    .home-link {
      display: inline-block;
      margin-top: 18px;
      text-align: center;
      width: 100%;
      color: var(--muted);
      text-decoration: none;
      font-weight: 600;
    }

    .home-link:hover {
      color: white;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Admin</h1>
    <p class="subtitle">Enter the password to view messages</p>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
      <div>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter admin password" required />
      </div>
      <button type="submit">Log in</button>
    </form>

    <a class="home-link" href="/">Back to the message form</a>
  </div>
</body>
</html>
