<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anonymous Messages</title>
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #111827;
      --panel: rgba(15, 23, 42, 0.9);
      --panel-2: #1f2937;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent: #38bdf8;
      --accent-2: #a78bfa;
      --success: #22c55e;
      --border: rgba(148, 163, 184, 0.2);
      --shadow: rgba(15, 23, 42, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, var(--bg-1), var(--bg-2), #1e293b);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: min(760px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 24px 60px var(--shadow);
      padding: 28px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 2.8rem);
      letter-spacing: -0.04em;
    }

    .count-pill {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      font-weight: bold;
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 0.9rem;
      min-width: 120px;
      text-align: center;
      box-shadow: 0 8px 18px rgba(56, 189, 248, 0.3);
    }

    .subtitle {
      margin: 0 0 24px;
      color: var(--muted);
      text-align: center;
      font-size: 1rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    textarea {
      width: 100%;
      min-height: 200px;
      resize: vertical;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.22);
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    button {
      appearance: none;
      border: none;
      border-radius: 12px;
      color: white;
      background: linear-gradient(135deg, var(--accent), #0ea5e9);
      font-weight: 700;
      padding: 12px 18px;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
      font-size: 1rem;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px 16px;
      }

      .header, .actions {
        flex-direction: column;
        align-items: stretch;
      }

      .count-pill {
        width: 100%;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Anonymous Notes</h1>
      <div class="count-pill">{{ message_count }} messages</div>
    </div>

    <p class="subtitle">Share something honest, kind, or random — no names needed.</p>

    <form method="POST" action="/submit">
      <textarea name="message" placeholder="Type your message here..." required></textarea>
      <div class="actions">
        <button type="submit">Send anonymously</button>
      </div>
    </form>
  </div>
</body>
</html>
