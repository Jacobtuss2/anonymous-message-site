<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anonymous Messages</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --text: #f9fafb;
      --muted: #cbd5e1;
      --accent: #38bdf8;
      --border: #334155;
      --shadow: rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #111827 50%, #1e293b 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 760px;
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 16px 40px var(--shadow);
      padding: 28px;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: clamp(2rem, 5vw, 2.8rem);
      text-align: center;
    }

    .subtitle {
      margin: 0 0 22px;
      color: var(--muted);
      text-align: center;
      font-size: 1rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      font-size: 1rem;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
    }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      appearance: none;
      border: none;
      background: linear-gradient(135deg, var(--accent), #0ea5e9);
      color: white;
      font-weight: bold;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    .link-button {
      color: var(--muted);
      text-decoration: none;
      font-weight: 600;
    }

    .link-button:hover {
      color: white;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px 16px;
      }

      .actions {
        flex-direction: column;
        align-items: stretch;
      }

      button, .link-button {
        text-align: center;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Leave an anonymous message</h1>
    <p class="subtitle">Write something honest, kind, or random — no names needed.</p>

    <form method="POST" action="/submit">
      <textarea name="message" placeholder="Type your message here..." required></textarea>
      <div class="actions">
        <button type="submit">Send anonymously</button>
        <a class="link-button" href="/admin">View messages</a>
      </div>
    </form>
  </div>
</body>
</html>
